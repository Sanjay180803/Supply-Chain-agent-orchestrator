name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No LLM calls: agent dispatch and intent classification are stubbed.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install redis requests pytest fastapi httpx pydantic
      - run: pytest tests -v
